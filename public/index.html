<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JamSync · minimal music sync</title>
    <!-- fonts & icons (kept as external for professional feel) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* INLINE CSS — creative & professional redesign */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0b0f17 0%, #141b29 100%);
            color: #edeef2;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        /* main card – glassmorphic depth */
        .app-container {
            max-width: 1100px;
            width: 100%;
            height: 95vh;
            background: rgba(18, 22, 33, 0.75);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 36px;
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* header with dynamic gradient */
        header {
            padding: 24px 30px;
            background: rgba(12, 17, 27, 0.6);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(130deg, #b57bff, #ff6b9d, #70e2ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            text-shadow: 0 0 15px rgba(255, 107, 157, 0.3);
        }

        .now-playing-mobile {
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.04);
            color: #b9c2d4;
            max-width: 260px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            backdrop-filter: blur(4px);
        }

        /* scrollable main content */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 30px 10px 30px;
            scrollbar-width: thin;
            scrollbar-color: #ff6b9d #1e2534;
        }
        .main-content::-webkit-scrollbar {
            width: 5px;
        }
        .main-content::-webkit-scrollbar-track {
            background: #1e2534;
            border-radius: 10px;
        }
        .main-content::-webkit-scrollbar-thumb {
            background: #ff6b9d;
            border-radius: 10px;
        }

        /* playlist & search section */
        .playlist-control {
            display: flex;
            gap: 14px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .playlist-dropdown {
            background: rgba(20, 28, 45, 0.7);
            border: 1px solid rgba(255, 107, 157, 0.2);
            border-radius: 48px;
            padding: 12px 28px;
            color: #fff;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(8px);
            flex: 1;
            min-width: 180px;
            transition: all 0.2s;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23ff6b9d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
            background-repeat: no-repeat;
            background-position: right 20px center;
            background-size: 16px;
        }
        .playlist-dropdown:hover {
            border-color: #ff6b9d;
            background-color: rgba(40, 48, 68, 0.8);
        }

        .btn-small {
            background: rgba(255, 107, 157, 0.15);
            border: 1px solid rgba(255, 107, 157, 0.3);
            border-radius: 48px;
            padding: 0 28px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #ffb9d2;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(8px);
            letter-spacing: 0.3px;
        }
        .btn-small i {
            font-size: 1rem;
            color: #ff6b9d;
        }
        .btn-small:hover {
            background: rgba(255, 107, 157, 0.3);
            border-color: #ff6b9d;
            color: white;
        }

        /* search bar — elevated */
        .search-bar {
            position: relative;
            margin-bottom: 30px;
        }
        .search-bar i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #9aa4bf;
            font-size: 1rem;
            pointer-events: none;
            opacity: 0.7;
        }
        .search-bar input {
            width: 100%;
            background: rgba(12, 18, 30, 0.6);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 56px;
            padding: 16px 24px 16px 52px;
            font-size: 1rem;
            color: white;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 6px 8px rgba(0,0,0,0.4), 0 0 0 1px rgba(255, 107, 157, 0) ;
            transition: 0.2s;
        }
        .search-bar input:focus {
            border-color: #ff6b9d;
            outline: none;
            background: rgba(20, 30, 48, 0.8);
            box-shadow: inset 0 6px 10px rgba(0,0,0,0.6), 0 0 0 1px rgba(255, 107, 157, 0.3);
        }

        /* tracks list — modern cards */
        .tracks-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 10px;
        }

        .track {
            display: flex;
            align-items: center;
            padding: 14px 22px;
            background: rgba(20, 26, 41, 0.35);
            backdrop-filter: blur(4px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            transition: all 0.2s ease;
            cursor: pointer;
            box-shadow: 0 6px 12px -10px #000;
        }
        .track:hover {
            background: rgba(40, 48, 70, 0.7);
            border-color: rgba(255, 107, 157, 0.2);
            transform: scale(1.01) translateY(-2px);
            box-shadow: 0 18px 24px -16px #ff6b9d40;
        }
        .track.active {
            background: linear-gradient(95deg, rgba(255, 107, 157, 0.2), rgba(120, 80, 200, 0.2));
            border-left: 4px solid #ff6b9d;
            border-radius: 28px 28px 28px 28px;
        }
        .track.playing {
            background: linear-gradient(95deg, rgba(255, 107, 157, 0.3), rgba(160, 120, 255, 0.2));
            box-shadow: 0 0 0 1px #ff6b9d, 0 12px 28px -12px #ff6b9d;
        }

        /* waveform icon (creative) */
        .track-wave {
            width: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff6b9d;
            font-size: 1.2rem;
        }

        .track-info {
            flex: 1;
            margin-left: 12px;
        }
        .track-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.2px;
            color: #f1f3f8;
        }
        .track-meta {
            display: flex;
            gap: 18px;
            margin-top: 5px;
            font-size: 0.8rem;
            color: #919cbb;
        }
        .track-likes {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.02);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            border: 1px solid rgba(255,255,255,0.02);
            color: #ffb0c0;
        }
        .track-likes i {
            margin-right: 6px;
            color: #ff6b9d;
        }

        /* player bar — floating, distinct */
        .player-bar {
            background: rgba(8, 12, 22, 0.9);
            backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 107, 157, 0.25);
            padding: 12px 30px 16px 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -8px 30px -10px #000;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .track-info {
            overflow: hidden;
        }
        .track-name {
            font-size: 1rem;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .artist-name {
            font-size: 0.8rem;
            color: #9ba6c9;
            margin-top: 2px;
        }

        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin: 12px 0 10px;
        }
        .btn-control {
            background: transparent;
            border: none;
            color: #cdd6f0;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.15s;
            opacity: 0.7;
            filter: drop-shadow(0 2px 4px #000);
        }
        .btn-control:hover {
            opacity: 1;
            color: #ffb2d1;
            transform: scale(1.1);
        }
        .btn-play-pause {
            background: linear-gradient(145deg, #ff6b9d, #b762d9);
            border: none;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            color: #0b0f17;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 22px -4px #ff6b9d, 0 0 0 2px rgba(255,255,255,0.1);
            transition: 0.2s;
            cursor: pointer;
        }
        .btn-play-pause:hover {
            transform: scale(1.06);
            box-shadow: 0 10px 28px -2px #ff80aa;
        }

        .progress-container {
            width: 100%;
            margin-top: 6px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(50, 58, 82, 0.6);
            border-radius: 10px;
            cursor: pointer;
            backdrop-filter: blur(2px);
            box-shadow: inset 0 1px 4px #000;
        }
        .progress {
            height: 100%;
            width: 37%; /* demo progress */
            background: linear-gradient(90deg, #ffb1d0, #b57bff);
            border-radius: 10px;
            position: relative;
            box-shadow: 0 0 12px #ff99c2;
        }
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #95a0c2;
            margin-top: 6px;
            font-weight: 500;
        }

        /* audio element hidden */
        #audioPlayer {
            display: none;
        }

        /* responsive finesse */
        @media (min-width: 680px) {
            .player-bar {
                flex-direction: row;
                align-items: center;
                gap: 30px;
                padding: 12px 30px;
            }
            .player-info {
                flex: 2;
            }
            .player-controls {
                flex: 3;
                margin: 0;
            }
            .progress-container {
                flex: 3;
            }
            .now-playing-mobile {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .app-container { border-radius: 24px; }
            header { padding: 18px 20px; }
            .main-content { padding: 15px 18px; }
            .track { padding: 12px 16px; }
        }

        /* tiny extra glow for active states */
        .active .track-wave i {
            color: #ffdf6b;
            text-shadow: 0 0 8px gold;
        }
        .fa-solid, .fa-regular { pointer-events: none; }
    </style>
</head>
<body>
<div class="app-container">
    <!-- Main Content -->
    <div class="main-content">
        <header>
            <h1>JamSync</h1>
            <div class="now-playing-mobile" id="nowPlayingMobile">
                <i class="fas fa-wave-square" style="margin-right: 6px; color: #ff6b9d;"></i>
                <span>Select a track</span>
            </div>
        </header>

        <div class="content">
            <!-- playlist row -->
            <div class="playlist-control">
                <select id="playlistSelect" class="playlist-dropdown">
                    <option value="default">🎧 Default Playlist</option>
                    <option value="favorites">⭐ Favorites</option>
                </select>
                <button id="addToPlaylist" class="btn-small">
                    <i class="fas fa-plus-circle"></i> Add current
                </button>
            </div>

            <!-- search -->
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search tracks, artists..." id="searchInput">
            </div>

            <!-- dynamic track list mockup (visually rich) -->
            <div class="tracks-list" id="musicList">
                <!-- sample tracks with inline proof-of-concept (design demo) -->
                <div class="track active playing" data-index="0">
                    <span class="track-wave"><i class="fas fa-circle-notch"></i></span>
                    <div class="track-info">
                        <div class="track-title">Neural Waves</div>
                        <div class="track-meta"><span>Eliot Stellar</span><span>3:24</span></div>
                    </div>
                    <div class="track-likes"><i class="fas fa-heart"></i> 231</div>
                </div>
                <div class="track" data-index="1">
                    <span class="track-wave"><i class="fas fa-soundcloud"></i></span>
                    <div class="track-info">
                        <div class="track-title">Velvet Code</div>
                        <div class="track-meta"><span>Luna Echo</span><span>4:12</span></div>
                    </div>
                    <div class="track-likes"><i class="fas fa-heart"></i> 89</div>
                </div>
                <div class="track" data-index="2">
                    <span class="track-wave"><i class="fas fa-bolt"></i></span>
                    <div class="track-info">
                        <div class="track-title">Synthflux</div>
                        <div class="track-meta"><span>MODERNS</span><span>3:56</span></div>
                    </div>
                    <div class="track-likes"><i class="fas fa-heart"></i> 148</div>
                </div>
                <div class="track" data-index="3">
                    <span class="track-wave"><i class="fas fa-infinity"></i></span>
                    <div class="track-info">
                        <div class="track-title">Drift Apart</div>
                        <div class="track-meta"><span>Kai & Kitsune</span><span>5:02</span></div>
                    </div>
                    <div class="track-likes"><i class="fas fa-heart"></i> 415</div>
                </div>
                <div class="track" data-index="4">
                    <span class="track-wave"><i class="fas fa-sparkles"></i></span>
                    <div class="track-info">
                        <div class="track-title">Neon Glow</div>
                        <div class="track-meta"><span>Astral</span><span>3:18</span></div>
                    </div>
                    <div class="track-likes"><i class="fas fa-heart"></i> 277</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Player Bar (bottom) -->
    <div class="player-bar">
        <div class="player-info">
            <div class="track-info">
                <div class="track-name" id="currentTrackName">
                    <i class="fas fa-play-circle" style="color:#ff6b9d; font-size:0.9rem;"></i> Neural Waves
                </div>
                <div class="artist-name" id="currentArtist">Eliot Stellar</div>
            </div>
        </div>

        <div class="player-controls">
            <button class="btn-control" id="prevBtn"><i class="fas fa-backward-step"></i></button>
            <button class="btn-play-pause" id="playPauseBtn"><i class="fas fa-play" style="margin-left: 2px;"></i></button>
            <button class="btn-control" id="nextBtn"><i class="fas fa-forward-step"></i></button>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar">
                <div class="progress" id="songProgress" style="width: 37%;"></div>
            </div>
            <div class="time-display">
                <span id="currentTime">1:17</span>
                <span id="totalTime">3:24</span>
            </div>
        </div>
        <audio id="audioPlayer"></audio>
    </div>
</div>

<!-- minimal js (placeholder for interactivity but design works standalone) -->
<script>
    // just to keep inline behavior smooth, no backend required
    (function() {
        // make tracks selectable
        const tracks = document.querySelectorAll('.track');
        tracks.forEach(t => {
            t.addEventListener('click', function(e) {
                tracks.forEach(t2 => t2.classList.remove('active', 'playing'));
                this.classList.add('active', 'playing');
                // update now playing text (demo)
                const title = this.querySelector('.track-title')?.innerText || 'Track';
                const artist = this.querySelector('.track-meta span')?.innerText || 'Artist';
                document.getElementById('currentTrackName').innerHTML = `<i class="fas fa-play-circle" style="color:#ff6b9d; font-size:0.9rem;"></i> ${title}`;
                document.getElementById('currentArtist').innerText = artist;
                document.querySelector('#nowPlayingMobile span').innerText = title;
                // mock progress and time
                document.getElementById('songProgress').style.width = '13%';
                document.getElementById('currentTime').innerText = '0:42';
                const total = this.querySelector('.track-meta span:last-child')?.innerText || '3:24';
                document.getElementById('totalTime').innerText = total;
            });
        });

        // play/pause toggle demo
        const playBtn = document.getElementById('playPauseBtn');
        const icon = playBtn.querySelector('i');
        playBtn.addEventListener('click', () => {
            if (icon.classList.contains('fa-play')) {
                icon.classList.remove('fa-play');
                icon.classList.add('fa-pause');
            } else {
                icon.classList.remove('fa-pause');
                icon.classList.add('fa-play');
            }
        });

        // progress bar seek simulation
        const progBar = document.getElementById('progressBar');
        progBar.addEventListener('click', (e) => {
            const rect = progBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            document.getElementById('songProgress').style.width = (percent * 100) + '%';
        });

        // search input dummy
        document.getElementById('searchInput').addEventListener('input', function(e) {
            // just ui demo – no filter
        });
    })();
</script>
<!-- (socket.io script placeholder if needed, but design stands alone) -->
<script src="/socket.io/socket.io.js" style="display:none;"></script>
</body>
</html>
